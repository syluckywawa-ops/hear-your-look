# Creates billable resources only when approved in Render. Do not deploy until
# the owner confirms the plan, disk charges, public URL and secret variables.
services:
  - type: web
    name: hear-your-look
    runtime: python
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py 'hosted:create_app()'
    healthCheckPath: /healthz
    autoDeployTrigger: off
    disk:
      name: quota-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PUBLIC_ORIGIN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: HYL_ACCESS_USER
        value: team
      - key: HYL_ACCESS_PASSWORD
        sync: false
      - key: HYL_SESSION_SECRET
        generateValue: true
      - key: HYL_QUOTA_DB
        value: /var/data/hyl-quota.sqlite3
      - key: HYL_PERSISTENT_STORAGE
        value: '1'
      - key: HYL_AI_ENABLED
        value: '0'
      - key: HYL_DAILY_MODEL_CALLS
        value: '120'
      - key: HYL_ACCOUNT_PER_MINUTE
        value: '3'
      - key: HYL_GLOBAL_PER_MINUTE
        value: '12'
